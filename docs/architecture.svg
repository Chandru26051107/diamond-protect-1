<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="820" fill="#F4F1EA"/>

  <!-- title -->
  <text x="40" y="52" font-size="30" font-weight="900" fill="#0A0A0A" letter-spacing="-1">DIAMOND-PROTECT</text>
  <text x="40" y="78" font-size="13" font-weight="700" fill="#0A0A0A" letter-spacing="2">AI-POWERED REAL-TIME UPI FRAUD, FAKE-QR AND MULE-ACCOUNT PROTECTION</text>
  <text x="40" y="100" font-size="12" font-weight="700" fill="#B45309" letter-spacing="1">HACKATHON PROTOTYPE · SYNTHETIC DATA ONLY · NO CONNECTION TO UPI, NPCI, BANKS OR REAL FINANCIAL SYSTEMS</text>
  <line x1="40" y1="114" x2="1160" y2="114" stroke="#0A0A0A" stroke-width="3"/>

  <!-- clients -->
  <g>
    <rect x="40" y="140" width="520" height="112" fill="#22D3EE" stroke="#0A0A0A" stroke-width="3"/>
    <text x="62" y="172" font-size="15" font-weight="900" fill="#0A0A0A">USER PAYMENT SHIELD</text>
    <text x="62" y="196" font-size="12" font-weight="600" fill="#0A0A0A">pay &amp; score · diamond QR verify · trust result</text>
    <text x="62" y="216" font-size="12" font-weight="600" fill="#0A0A0A">transaction history · diamond safety centre</text>
    <text x="62" y="238" font-size="11" font-weight="700" fill="#0A0A0A" letter-spacing="1">CUSTOMER-FACING</text>
  </g>
  <g>
    <rect x="640" y="140" width="520" height="112" fill="#FDE047" stroke="#0A0A0A" stroke-width="3"/>
    <text x="662" y="172" font-size="15" font-weight="900" fill="#0A0A0A">DIAMOND COMMAND CENTRE</text>
    <text x="662" y="196" font-size="12" font-weight="600" fill="#0A0A0A">overview KPIs · transaction investigator · muleNet graph</text>
    <text x="662" y="216" font-size="12" font-weight="600" fill="#0A0A0A">merchant QR registry · fraud case manager · rule control</text>
    <text x="662" y="238" font-size="11" font-weight="700" fill="#0A0A0A" letter-spacing="1">BANK FRAUD ANALYST (PRIMARY DEMO USER)</text>
  </g>

  <!-- arrows down -->
  <line x1="300" y1="252" x2="300" y2="300" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="252" x2="900" y2="300" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- api band -->
  <rect x="40" y="300" width="1120" height="52" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="62" y="324" font-size="12" font-weight="900" fill="#0A0A0A" letter-spacing="1">PROTOTYPE API (queries · mutations · actions)</text>
  <text x="62" y="342" font-size="11" font-weight="600" fill="#0A0A0A">scoreTransaction · verifyQr · generateQr · tamperQr · reportFraud · metrics · mulenet · cases · updateCase · settings · seedDemoData</text>

  <!-- three layers -->
  <g>
    <rect x="40" y="380" width="352" height="196" fill="#7DD3FC" stroke="#0A0A0A" stroke-width="3"/>
    <text x="62" y="412" font-size="14" font-weight="900" fill="#0A0A0A">LAYER 1 · QR SHIELD</text>
    <text x="62" y="438" font-size="11" font-weight="600" fill="#0A0A0A">HMAC-SHA256 over canonical JSON</text>
    <text x="62" y="458" font-size="11" font-weight="600" fill="#0A0A0A">merchant identity + VPA match</text>
    <text x="62" y="478" font-size="11" font-weight="600" fill="#0A0A0A">amount · version · expiry</text>
    <text x="62" y="498" font-size="11" font-weight="600" fill="#0A0A0A">9-check verification verdict</text>
    <text x="62" y="524" font-size="11" font-weight="700" fill="#0A0A0A">detects: fake sticker · edited payload</text>
    <text x="62" y="542" font-size="11" font-weight="700" fill="#0A0A0A">impersonation · redirect · expiry</text>
    <rect x="62" y="552" width="120" height="0" fill="none"/>
  </g>
  <g>
    <rect x="424" y="380" width="352" height="196" fill="#F59E0B" stroke="#0A0A0A" stroke-width="3"/>
    <text x="446" y="412" font-size="14" font-weight="900" fill="#0A0A0A">LAYER 2 · RULE + ML</text>
    <text x="446" y="438" font-size="11" font-weight="600" fill="#0A0A0A">15 deterministic fraud rules</text>
    <text x="446" y="458" font-size="11" font-weight="600" fill="#0A0A0A">in-app trained risk model</text>
    <text x="446" y="478" font-size="11" font-weight="600" fill="#0A0A0A">12-feature contract · class balancing</text>
    <text x="446" y="498" font-size="11" font-weight="600" fill="#0A0A0A">ROC-AUC · F1 · confusion matrix</text>
    <text x="446" y="524" font-size="11" font-weight="700" fill="#0A0A0A">detects: amount anomaly · new payee</text>
    <text x="446" y="542" font-size="11" font-weight="700" fill="#0A0A0A">device/location change · bursts · odd hours</text>
  </g>
  <g>
    <rect x="808" y="380" width="352" height="196" fill="#EF4444" stroke="#0A0A0A" stroke-width="3"/>
    <text x="830" y="412" font-size="14" font-weight="900" fill="#FFFFFF">LAYER 3 · MULENET</text>
    <text x="830" y="438" font-size="11" font-weight="600" fill="#FFFFFF">directed transaction graph</text>
    <text x="830" y="458" font-size="11" font-weight="600" fill="#FFFFFF">degree · inflow · outflow ratio</text>
    <text x="830" y="478" font-size="11" font-weight="600" fill="#FFFFFF">receive→forward latency · clustering</text>
    <text x="830" y="498" font-size="11" font-weight="600" fill="#FFFFFF">community + fraud cluster detection</text>
    <text x="830" y="524" font-size="11" font-weight="700" fill="#FFFFFF">detects: mule collectors · rapid forwarding</text>
    <text x="830" y="542" font-size="11" font-weight="700" fill="#FFFFFF">fan-in rings · laundering clusters</text>
  </g>

  <!-- arrows to score -->
  <line x1="216" y1="576" x2="216" y2="620" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="576" x2="600" y2="620" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="984" y1="576" x2="984" y2="620" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="620" width="1120" height="76" fill="#0A0A0A"/>
  <text x="62" y="652" font-size="15" font-weight="900" fill="#F4F1EA">DIAMOND TRUST SCORE = 100 − (0.45 · RuleRisk + 0.35 · MLRisk + 0.20 · GraphRisk)</text>
  <text x="62" y="676" font-size="12" font-weight="700" fill="#22D3EE">80–100 DIAMOND SAFE · PROCEED          55–79 DIAMOND CAUTION · VERIFY          0–54 DIAMOND ALERT · DO NOT PAY</text>

  <!-- data layer -->
  <rect x="40" y="716" width="1120" height="72" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="62" y="742" font-size="12" font-weight="900" fill="#0A0A0A" letter-spacing="1">SYNTHETIC DATA LAYER (DETERMINISTIC GENERATOR)</text>
  <text x="62" y="764" font-size="11" font-weight="600" fill="#0A0A0A">500 customers · 60 merchants · 300 signed QR codes · 8,000 transactions (~12% fraud) · 120 fraud cases · 20 mule clusters · audit log · rule settings · model artifact</text>
  <text x="62" y="782" font-size="10" font-weight="700" fill="#B45309">Every row is generated locally on your machine. No real UPI, NPCI, bank or customer data is used at any point.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#0A0A0A"/>
    </marker>
  </defs>
</svg>
